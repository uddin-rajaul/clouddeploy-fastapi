name: AWS SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ssm-test:
    name: Test AWS SSM access
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::116527261682:role/clouddeploy-github-deploy-role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send harmless SSM command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-051a3b2b68488e441 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["whoami","hostname"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-051a3b2b68488e441

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-051a3b2b68488e441 \
            --query 'StandardOutputContent' \
            --output text