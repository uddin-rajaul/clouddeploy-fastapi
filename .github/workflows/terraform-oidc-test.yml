name: Terraform OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test Terraform AWS Access
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::116527261682:role/clouddeploy-terraform-role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Terraform state access
        run: |
          aws s3api head-object \
            --bucket clouddeploy-terraform-state-116527261682 \
            --key clouddeploy/production/terraform.tfstate